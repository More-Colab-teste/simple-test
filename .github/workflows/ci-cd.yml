name: CI/CD Pipeline

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/home/ubuntu/simple-test

            # If the app folder doesn't exist, clone repo
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p $APP_DIR
              cd $APP_DIR
              git clone https://github.com/${{ github.repository }} .
            else
              cd $APP_DIR
              git fetch origin
              git checkout production
              git pull origin production
            fi

            # Install dependencies
            npm ci

            # Start or restart app with PM2
            pm2 start app.js --name simple-test || pm2 restart simple-test
            pm2 save
